version: "2"

linters:
  enable:
    - bodyclose
    - gosec
    - gochecknoinits
    - misspell
    - modernize
    - noctx
    - unconvert
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
